<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>History - Expense Tracker</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- PWA Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f8f6" media="(prefers-color-scheme: light)">
    <link rel="apple-touch-icon" href="vertex_app_icon.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13", // Neon Green
                        "primary-dark": "#0a8a0a",
                        "background-light": "#f6f8f6",
                        "background-dark": "#050505", // Metallic Black
                        "surface-light": "#ffffff",
                        "surface-dark": "#121212", // Dark Gray Surface
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                    }
                },
            },
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        
        /* Enable View Transitions for smooth page loads */


        /* Fallback / Additional Layout Animation */
        .animate-enter {
            animation: enter 0.4s ease-out;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .material-symbols-outlined,
        .material-symbols-filled {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-family: 'Material Symbols Outlined';
            font-size: 24px;
        }

        .material-symbols-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .nav-item {
            position: relative;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        .nav-item:hover {
            transform: translateY(-2px);
        }

        /* View Transition Anchors */
        nav {
            view-transition-name: bottom-nav;
        }

        main {
            view-transition-name: main-content;
        }
    </style>
    <script>
        if (localStorage.getItem('Vertex_theme') === 'dark' || (!('Vertex_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
    <div
        class="relative flex h-full min-h-screen w-full flex-col md:flex-row overflow-hidden max-w-md md:max-w-7xl mx-auto bg-background-light dark:bg-background-dark shadow-2xl md:shadow-none md:border-x border-slate-100 dark:border-white/5 md:animate-none">

        <!-- Desktop Sidebar Navigation -->
        <aside class="hidden md:flex flex-col w-64 bg-white/50 dark:bg-surface-dark/30 backdrop-blur-md border-r border-slate-100 dark:border-white/5 p-6 h-screen sticky top-0 shrink-0">
            <div class="flex items-center gap-3 mb-10">
                <div class="bg-center bg-no-repeat bg-cover rounded-xl size-8" style="background-image: url('vertex_app_icon.png'); background-size: contain;"></div>
                <h1 class="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight">Vertex</h1>
            </div>
            <nav class="flex flex-col gap-2 flex-1">
                <a href="dashboard.html" class="flex items-center gap-3 p-3 rounded-xl text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5 transition-all font-medium">
                    <span class="material-symbols-outlined text-2xl">home</span>
                    Dashboard
                </a>
                <a href="add_expense.html" class="flex items-center gap-3 p-3 rounded-xl text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5 transition-all font-medium">
                    <span class="material-symbols-outlined text-2xl">add_circle</span>
                    Add Expense
                </a>
                <a href="#" class="flex items-center gap-3 p-3 rounded-xl bg-primary/10 text-primary-dark dark:text-primary font-bold transition-all relative overflow-hidden group">
                    <span class="absolute inset-0 bg-primary/10 translate-y-full group-hover:translate-y-0 transition-transform"></span>
                    <span class="material-symbols-filled text-2xl relative z-10">history</span>
                    <span class="relative z-10">History</span>
                </a>
                <a href="settings.html" class="flex items-center gap-3 p-3 rounded-xl text-slate-500 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5 transition-all font-medium">
                    <span class="material-symbols-outlined text-2xl">settings</span>
                    Settings
                </a>
            </nav>
            <div class="mt-auto pt-6 border-t border-slate-100 dark:border-white/5">
                <div class="flex items-center gap-3">
                    <div class="bg-center bg-no-repeat bg-cover rounded-full size-10 ring-2 ring-primary/20" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBmO6Ia_1gyZc9Pjh2V408TCQuJGcGq4eFJYfJ_2FJiCQZCyzfggK-kP61pKwZlyMDw_Tt6GUJvM9QOaccrwuXnUSMAHMPG-n-KF367vIfk3z6Mi7Em5I_MbKD-RM4cOWizAfUoT_sz8E6BbTDUf3v5pHGXzCc0WfWU0OHfqGBW8IADbBVShsP0rk2fJbEXqmpbOo6upuVxHWntTOdP4m-1hVRqUIjYiEW8bPWIPEdyobXjNu6qlF0wPwpw-Xk6z8ZU9qnRamVCsl8');"></div>
                    <div class="flex flex-col">
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Account</span>
                        <span class="text-sm font-bold text-slate-900 dark:text-white desktop-user-name-display">User</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Mobile/Desktop Context Wrapper -->
        <div class="flex-1 flex flex-col w-full h-full relative overflow-x-hidden md:animate-enter">

        <!-- Header -->
        <div
            class="sticky top-0 z-20 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 justify-between border-b border-slate-100 dark:border-white/5">
            <a href="dashboard.html"
                class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200 dark:hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined text-slate-900 dark:text-white">arrow_back_ios_new</span>
            </a>
            <h2
                class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">
                History</h2>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto no-scrollbar pb-24 animate-enter w-full max-w-3xl mx-auto md:pt-8 md:px-6">
            <!-- List Container -->
            <div id="history-list" class="flex flex-col gap-0 divide-y divide-slate-100 dark:divide-white/5">
                <!-- Items injected by JS -->
            </div>

            <!-- Empty State (Hidden by default) -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 opacity-50">
                <span class="material-symbols-outlined text-6xl mb-4">history_toggle_off</span>
                <p class="text-sm font-bold">No transactions yet</p>
            </div>
        </main>

        <!-- Navigation -->
        <nav
            class="md:hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 dark:bg-surface-dark/90 backdrop-blur-lg border-t border-slate-100 dark:border-slate-800 py-3 px-6 pb-6 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-20">
            <ul class="flex justify-between items-center">
                <li>
                    <a class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                        href="dashboard.html">
                        <span class="material-symbols-outlined text-2xl">home</span>
                        <span class="text-[10px] font-medium">Home</span>
                    </a>
                </li>
                <li>
                    <a class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                        href="add_expense.html">
                        <span class="material-symbols-outlined text-2xl">add_circle</span>
                        <span class="text-[10px] font-medium">Add Expense</span>
                    </a>
                </li>
                <li>
                    <a class="nav-item flex flex-col items-center gap-1 text-primary-dark dark:text-primary transition-colors"
                        href="#">
                        <span class="material-symbols-filled text-2xl">history</span>
                        <span class="text-[10px] font-bold">History</span>
                    </a>
                </li>
                <li>
                    <a class="nav-item flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
                        href="settings.html">
                        <span class="material-symbols-outlined text-2xl">settings</span>
                        <span class="text-[10px] font-medium">Settings</span>
                    </a>
                </li>
            </ul>
        </nav>
        </div> <!-- End Mobile Content Wrapper -->
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.desktop-user-name-display').forEach(el => el.textContent = getUser());
            renderHistory();
        });

        function renderHistory() {
            const listContainer = document.getElementById('history-list');
            const expenses = getExpenses();

            // Sort by date descending
            const sortedExpenses = [...expenses].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (sortedExpenses.length === 0) {
                listContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-center opacity-50">
                        <span class="material-symbols-outlined text-4xl mb-2">receipt_long</span>
                        <p class="text-sm font-medium">No transactions yet.</p>
                    </div>
                `;
            } else {
                listContainer.innerHTML = sortedExpenses.map(exp => {
                    // Category Icon Map (Reused)
                    const icons = { 'Food': 'restaurant', 'Transport': 'directions_bus', 'Shopping': 'shopping_bag', 'Home': 'home', 'Other': 'more_horiz' };
                    const colors = { 'Food': 'text-orange-500 bg-orange-50 dark:bg-orange-900/20', 'Transport': 'text-blue-500 bg-blue-50 dark:bg-blue-900/20', 'Shopping': 'text-purple-500 bg-purple-50 dark:bg-purple-900/20', 'Home': 'text-green-500 bg-green-50 dark:bg-green-900/20', 'Other': 'text-slate-500 bg-slate-50 dark:bg-slate-900/20' };

                    const icon = icons[exp.category] || 'payments';
                    const colorClass = colors[exp.category] || colors['Other'];

                    return `
                    <div class="flex items-center justify-between p-4 bg-white dark:bg-surface-dark rounded-xl shadow-soft border border-slate-100 dark:border-slate-800 group">
                        <div class="flex items-center gap-4">
                            <div class="size-12 rounded-full flex items-center justify-center ${colorClass}">
                                <span class="material-symbols-outlined">${icon}</span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-slate-900 dark:text-white font-bold text-base line-clamp-1">${exp.title}</span>
                                <span class="text-slate-500 dark:text-slate-400 text-xs font-medium">${formatDate(exp.date)}</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                             <span class="text-slate-900 dark:text-white font-bold text-base">-${formatCurrency(exp.amount)}</span>
                             <button onclick="handleDelete(${exp.id})" class="text-red-500 hover:text-red-700 text-xs font-medium opacity-0 group-hover:opacity-100 transition-opacity">Delete</button>
                        </div>
                    </div>
                    `;
                }).join('');
            }
        }

        function handleDelete(id) {
            if (confirm('Are you sure you want to delete this expense?')) {
                deleteExpense(id);
                renderHistory();
            }
        }
    </script>
</body>

</html>
